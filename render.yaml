services:
  - type: web
    name: koudi-stock
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir backend koudi_backend.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "22"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSLMODE
        value: "require"
      # --- E-mail (notifications devis/contact) ---------------------------
      # Valeurs à renseigner dans le dashboard Render (champs secrets) :
      #   EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / EMAIL_FROM
      # Exemple Gmail : EMAIL_HOST=smtp.gmail.com, PORT=587, USE_TLS=True.
      # Sans EMAIL_HOST l'e-mail part en "console" (messages perdus en prod).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_SUBJECT_PREFIX
        value: "[KOUDI WOOD] "
